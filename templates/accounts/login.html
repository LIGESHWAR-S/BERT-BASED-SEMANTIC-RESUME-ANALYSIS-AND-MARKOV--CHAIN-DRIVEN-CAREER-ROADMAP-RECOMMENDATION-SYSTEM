{% extends "base.html" %}

{% block title %}Sign In | CareerChain AI{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center py-6 px-4">
    <!-- Auth card -->
    <div class="w-full max-w-sm bg-white border border-slate-200 rounded-xl shadow-lg p-8 relative overflow-hidden">
        
        <!-- Header -->
        <div class="text-center pb-6 border-b border-slate-100">
            <!-- Custom Vector SVG Logo -->
            <div class="mx-auto w-12 h-12 rounded-xl bg-indigo-50 border border-indigo-100 flex items-center justify-center shadow-sm mb-4 text-indigo-600">
                <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="16" cy="7" r="2.5" stroke="currentColor" stroke-width="2"/>
                    <circle cx="7" cy="12" r="2.5" stroke="currentColor" stroke-width="2"/>
                    <circle cx="17" cy="17" r="2.5" stroke="currentColor" stroke-width="2"/>
                    <path d="M9.5 11L13.5 8M15.5 15.5L14 8.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
            </div>
            <h2 class="text-xl font-bold tracking-tight text-slate-800 font-display">Welcome Back</h2>
            <p class="mt-1 text-xs text-slate-400">
                Log in to your workspace or
                <a href="{% url 'register' %}" class="font-bold text-indigo-600 hover:text-indigo-500 transition-colors">
                    create an account
                </a>
            </p>
        </div>
        
        <!-- Form -->
        <form class="mt-6 space-y-4" method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="space-y-3">
                <div>
                    <label for="id_username" class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                            <i class="fa-solid fa-user-tag text-xs"></i>
                        </span>
                        <input id="id_username" name="username" type="text" required class="appearance-none rounded-lg relative block w-full pl-9 pr-3 py-2.5 border border-slate-200 bg-slate-50 placeholder-slate-400 text-slate-800 focus:outline-none focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500 text-xs font-semibold transition-all" placeholder="Enter username">
                    </div>
                </div>
                
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label for="id_password" class="block text-[10px] font-bold uppercase tracking-wider text-slate-400">Password</label>
                        <a href="#" class="text-[10px] font-semibold text-slate-400 hover:text-slate-600 transition-colors">Forgot Password?</a>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                            <i class="fa-solid fa-key text-xs"></i>
                        </span>
                        <input id="id_password" name="password" type="password" required class="appearance-none rounded-lg relative block w-full pl-9 pr-3 py-2.5 border border-slate-200 bg-slate-50 placeholder-slate-400 text-slate-800 focus:outline-none focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500 text-xs font-semibold transition-all" placeholder="Enter security password">
                    </div>
                </div>
            </div>

            <div class="pt-2">
                <button type="submit" class="w-full flex justify-center py-2.5 px-4 border border-transparent text-xs font-bold uppercase tracking-wider rounded-lg text-white bg-indigo-600 hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all duration-150 cursor-pointer shadow-md active:scale-[0.98]">
                    Sign In
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
